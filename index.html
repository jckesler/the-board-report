<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Board Report</title>
<meta name="description" content="A 15 to 20 minute game: build a one-page security and privacy report for a board's audit committee, then answer the directors' questions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Same visual system as The 2AM Page, Keys to the Agent and Ship It? */
:root{
  --bg:#f3f1ee; --panel:#ffffff; --ink:#1c1a19; --muted:#6a6460; --line:#dcd6d0;
  --red:#cc0000; --red-soft:#fbe6e6; --aqua:#00796b; --aqua-soft:#e2f2ef; --amber:#a35a00; --amber-soft:#fbefdc;
  --good:#2e7d4f; --good-soft:#e3f2e8; --shadow:0 1px 0 rgba(0,0,0,.04);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161413; --panel:#211e1c; --ink:#f1ece8; --muted:#a69d97; --line:#3a3532;
  --red:#ff6b6b; --red-soft:#3a1f1f; --aqua:#4fc3b1; --aqua-soft:#16302c; --amber:#f0a94b; --amber-soft:#35281a;
  --good:#6fcf97; --good-soft:#18301f; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161413; --panel:#211e1c; --ink:#f1ece8; --muted:#a69d97; --line:#3a3532;
  --red:#ff6b6b; --red-soft:#3a1f1f; --aqua:#4fc3b1; --aqua-soft:#16302c; --amber:#f0a94b; --amber-soft:#35281a;
  --good:#6fcf97; --good-soft:#18301f; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
.credit{margin-top:32px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.credit a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
a{color:var(--aqua)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--red);padding-bottom:10px;margin-bottom:22px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:28px;letter-spacing:.01em}
.brand .eyebrow{color:var(--red)}
.linkbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:14px;color:var(--muted)}
.linkbtn:hover{border-color:var(--ink);color:var(--ink)}
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
.intro .lede{font-size:19px;max-width:60ch}
.intro h2{font-size:44px;margin:6px 0 14px}
.rules{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow)}
.rules ul{margin:8px 0 0;padding-left:18px}
.rules li{margin:6px 0}
.cases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:26px}
.case{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left}
.case:hover{border-color:var(--ink)}
.case h3{font-size:21px}
.case p{margin:0;font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);align-self:flex-start}
.primary{background:var(--red);color:#fff;border:0;border-radius:8px;padding:13px 22px;font-weight:600;font-size:16px}
.primary:hover{filter:brightness(1.08)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px}
.note{font-size:13px;color:var(--muted)}
.game{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.scene{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.scene-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.clock{font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--red)}
.step{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.scene-body{padding:20px 22px 24px}
.scene-body h2{font-size:30px;margin-bottom:10px}
.scene-body p{margin:0 0 12px;max-width:68ch}
.inject{border-left:4px solid var(--ink);background:var(--bg);padding:10px 14px;border-radius:0 8px 8px 0;margin:4px 0 16px;font-size:15px}
.inject .eyebrow{display:block;margin-bottom:2px}
.outcome{border-radius:10px;padding:14px 16px;margin:4px 0 16px;border:1px solid var(--line)}
.outcome.l0{background:var(--good-soft);border-color:var(--good)}
.outcome.l1{background:var(--amber-soft);border-color:var(--amber)}
.outcome.l2{background:var(--red-soft);border-color:var(--red)}
.outcome .verdict{display:block;margin-bottom:4px}
.l0 .verdict{color:var(--good)} .l1 .verdict{color:var(--amber)} .l2 .verdict{color:var(--red)}
.outcome p{margin:0}
.ask{font-weight:600;margin-top:4px!important}
.choices{display:grid;gap:10px;margin-top:8px}
.choice{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
.choice:hover{border-color:var(--ink)}
.choice .k{font-family:var(--f-mono);font-weight:600;border:1px solid var(--line);border-radius:6px;text-align:center;padding:2px 0;color:var(--muted)}
.choice[disabled]{cursor:default;opacity:.55}
.choice.picked{opacity:1;border-color:var(--ink)}
.result{margin-top:18px;border-radius:10px;padding:16px 18px;border:1px solid var(--line);background:var(--bg)}
.result.best{background:var(--good-soft);border-color:var(--good)}
.result.ok{background:var(--amber-soft);border-color:var(--amber)}
.result.poor{background:var(--red-soft);border-color:var(--red)}
.verdict{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.best .verdict{color:var(--good)} .ok .verdict{color:var(--amber)} .poor .verdict{color:var(--red)}
.result p{margin:6px 0 0}
.lesson{font-size:14px;color:var(--muted);margin-top:8px!important}
.result .primary{margin-top:14px}
.rail{display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.board{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.board h3{font-size:18px;margin-bottom:10px}
.co{font-weight:600}
.co-sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.meter{margin:10px 0}
.meter .lab{display:flex;justify-content:space-between;font-size:13px}
.meter .lab b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.meter .hint{font-size:11px;color:var(--muted)}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-top:4px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.legs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.leg{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.leg.on{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.leg.half{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.log{list-style:none;margin:0;padding:0;font-size:13px;max-height:320px;overflow:auto}
.log li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.log li:first-child{border-top:0}
.log time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.log .empty{display:block;color:var(--muted);font-style:italic}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.progress{display:flex;gap:4px;padding:10px 20px 14px;border-top:1px solid var(--line)}
.progress span{flex:1;height:6px;border-radius:99px;background:var(--line)}
.progress span.done{background:var(--ink)}
.progress span.now{background:var(--red)}
.progress span.live{outline:1px dashed var(--muted);outline-offset:1px}
.end h2{font-size:40px;margin:6px 0 10px}
.grid2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .n{font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.trifecta{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.trifecta svg{width:100%;height:auto}
.trifecta svg text{font-family:var(--f-mono);font-size:11px;fill:var(--ink)}
.debrief{display:grid;gap:10px;margin-top:10px}
.dl{background:var(--panel);border:1px solid var(--line);border-left-width:5px;border-radius:8px;padding:12px 14px}
.dl.best{border-left-color:var(--good)} .dl.ok{border-left-color:var(--amber)} .dl.poor{border-left-color:var(--red)}
.dl .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.dl p{margin:6px 0 0;font-size:15px}
.real{background:var(--aqua-soft);border:1px solid var(--aqua);border-radius:10px;padding:16px 18px;margin-top:22px}
.real h3{font-size:22px;color:var(--aqua);margin-bottom:6px}
.real ul{margin:6px 0 0;padding-left:18px}
.real li{margin:6px 0}
.sec{margin-top:28px}
.sec>h3{font-size:24px;margin-bottom:8px}
@media (max-width:860px){.game,.intro,.trifecta{grid-template-columns:minmax(0,1fr)}.rail{position:static}.cases,.grid2{grid-template-columns:minmax(0,1fr)}.intro h2{font-size:34px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media print{
  :root,:root[data-theme="dark"]{--bg:#ffffff;--panel:#ffffff;--ink:#1c1a19;--muted:#555;--line:#cfcfcf;color-scheme:light}
  body{background:#fff;font-size:11pt}
  .wrap{max-width:none;padding:0}
  .topbar{margin-bottom:12px}
  #homeBtn,.end .row,.rail .log{display:none!important}
  .game{display:block}
  .rail{display:none!important}
  .grid2{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  .trifecta{grid-template-columns:200px minmax(0,1fr)!important}
  .dl,.stat,.real,.outcome,.trifecta{break-inside:avoid;page-break-inside:avoid}
  .printonly{display:block!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:none!important}
  @page{margin:14mm}
}
.printonly{display:none}

/* The Board Report additions */
.cardgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 4px}
.pick{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:88px}
.pick:hover{border-color:var(--ink)}
.pick.on{border-color:var(--aqua);background:var(--aqua-soft);box-shadow:inset 4px 0 0 var(--aqua)}
.pick .pt{font-size:15px;line-height:1.4}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag.mod{border-color:var(--aqua);color:var(--aqua)}
.cost{font-family:var(--f-mono);font-weight:600;font-size:14px}
.link{font-size:12px;font-family:var(--f-mono)}
.link.ok{color:var(--good)} .link.no{color:var(--red)}
.budget{font-family:var(--f-mono);font-size:14px}
.primary[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.dirgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0 16px}
.dir{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.dir h3{font-size:20px;margin:2px 0 6px}
.dir p{font-size:14px;margin:0}
.outline{margin:6px 0 0;padding-left:20px;font-size:13px}
.outline>li{margin:6px 0}
.outline>li.now>span{color:var(--red);font-weight:600}
.outline ul{margin:2px 0 0;padding-left:14px;color:var(--muted)}
.outline b{font-family:var(--f-mono);font-weight:500}
.dirs{list-style:none;margin:0;padding:0;font-size:14px}
.dirs li{padding:5px 0;border-top:1px dashed var(--line)} .dirs li:first-child{border-top:0}
.bl{display:flex;flex-direction:column;gap:6px;margin-top:18px;font-weight:600;font-size:15px}
.bl textarea{font:inherit;font-weight:400;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);resize:vertical}
.bl textarea:focus-visible{outline:2px solid var(--aqua);outline-offset:1px}
.dl .tags{display:inline-flex;vertical-align:1px;margin-left:4px}
@media (max-width:860px){.cardgrid,.dirgrid{grid-template-columns:minmax(0,1fr)}}
@media print{.cardgrid,.dirgrid{display:none!important}}
</style>

function status(s){
  var n = picksOf(s).length;
  if(s.budget) return askTotal()>CAP ? 'Over budget. Remove something.' : (n ? n+' request'+(n>1?'s':'')+'.' : 'No requests yet.');
  if(s.min===s.max) return n+' of '+s.max+' chosen.';
  return n+' chosen (pick '+s.min+' or '+s.max+').';
}
function toggle(s, id){
  if(s.id==='frame'){ st.frame = id; }
  else { var a = st[s.id], k = a.indexOf(id);
    if(k>=0) a.splice(k,1);
    else { if(s.budget && askTotal()+card(id).cost>CAP){ document.getElementById('msg').textContent = 'That would go over $'+CAP+'K. Remove something first.'; return; }
      if(a.length>=s.max){ if(s.max===1) a.length = 0; else { document.getElementById('msg').textContent = 'You can only pick '+s.max+'. Remove one first.'; return; } }
      a.push(id); } }
  if(s.id==='risk'){ st.ask = st.ask.filter(function(){ return true; }); }
  build();
}

/* ---------- scoring the report ---------- */
function scoreReport(){
  meters = {conf:50, cred:50};
  var all = [st.frame].concat(st.risk, st.metric, st.change, st.privacy);
  all.forEach(function(id){ var f = FX[grade(card(id))]; meters.conf = clamp(meters.conf + f.conf); meters.cred = clamp(meters.cred + f.cred); });
  var ag = askGrade(); var f = FX[ag.g]; meters.conf = clamp(meters.conf + f.conf); meters.cred = clamp(meters.cred + f.cred);
}
function askGrade(){
  if(!st.ask.length) return {g:'poor', l:'You asked for nothing. Boards expect the CISO to say what\'s needed; leaving it out makes the risks sound either solved or hopeless.'};
  var un = st.ask.filter(function(id){ return !askLinked(id); });
  if(un.length) return {g:'poor', l:'At least one request isn\'t tied to any of your top risks, so the ask reads as a wish list.'};
  if(askTotal() < CAP*0.5) return {g:'ok', l:'Every request ties to a risk, but you asked for less than half of what was available. Make sure the ask matches the size of the risks you described.'};
  return {g:'best', l:'Every request ties to one of your top risks, so each one has a reason the board can weigh.'};
}
function funding(){
  // Linked requests are approved; with low credibility the board defers the largest one.
  var linked = st.ask.filter(function(id){ return askLinked(id); }).slice();
  if(meters.cred < 45 && linked.length){ linked.sort(function(a,b){ return card(b).cost - card(a).cost; }); linked.shift(); }
  return {approved: linked, total: linked.reduce(function(a,id){ return a + card(id).cost; }, 0)};
}

/* ---------- Q&A ---------- */
function pickQs(){ var out = []; for(var k=0;k<QA.length && out.length<3;k++) if(QA[k].when(st)) out.push(QA[k]); return out; }
function qaStart(){ scoreReport(); qs = pickQs(); qi = 0; phase = 'qa'; qa(); }
function qa(){
  var q = qs[qi], d = co.dirs[q.who];
  var h = '<div class="game"><section class="scene"><div class="scene-head"><span class="clock">Thursday · Q&amp;A</span><span class="step">Question '+(qi+1)+' of '+qs.length+'</span></div><div class="scene-body"><span class="eyebrow">'+esc(d[0])+' · '+esc(d[1])+'</span><div class="inject" style="margin-top:8px">"'+esc(q.q(st, co))+'"</div><p class="ask">How do you answer?</p><div class="choices">';
  shuffle(q.a.map(function(_,j){ return j; })).forEach(function(j,n){ h += '<button class="choice" data-j="'+j+'"><span class="k">'+String.fromCharCode(65+n)+'</span><span>'+esc(q.a[j].t)+'</span></button>'; });
  h += '</div><div id="res"></div></div>'+progress()+'</section>'+rail()+'</div>';
  app.innerHTML = h;
  [].forEach.call(app.querySelectorAll('.choice'), function(b){ b.onclick = function(){ answer(+b.getAttribute('data-j')); }; });
  window.scrollTo(0,0);
}
var QFX = {best:{conf:8,cred:8}, ok:{conf:0,cred:2}, poor:{conf:-8,cred:-8}};
function applyAnswer(j){ var a = qs[qi].a[j]; st.ans.push(j); meters.conf = clamp(meters.conf + QFX[a.g].conf); meters.cred = clamp(meters.cred + QFX[a.g].cred); return a; }
function answer(j){
  var a = applyAnswer(j);
  [].forEach.call(app.querySelectorAll('.choice'), function(b){ b.disabled = true; if(+b.getAttribute('data-j')===j) b.classList.add('picked'); });
  var lab = a.g==='best'?'Strong answer':a.g==='ok'?'Partly right':'Costly answer', last = qi===qs.length-1;
  var res = document.getElementById('res');
  res.innerHTML = '<div class="result '+a.g+'" tabindex="-1"><span class="verdict">'+lab+'</span><p>'+esc(a.l)+'</p><button class="primary" id="next">'+(last?'See how it went':'Next question')+'</button></div>';
  var tmp = document.createElement('div'); tmp.innerHTML = rail(); var r = app.querySelector('.rail'); if(r) r.innerHTML = tmp.querySelector('.rail').innerHTML;
  var box = res.firstChild; box.focus({preventScroll:true}); box.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'nearest'});
  document.getElementById('next').onclick = function(){ qi++; if(qi<qs.length) qa(); else end(); };
}

/* ---------- run code ---------- */
var CODE = 'BRD1';
function idx(s, id){ for(var j=0;j<s.cards.length;j++) if(s.cards[j].id===id) return j; return -1; }
function runCode(){
  var n = [C.indexOf(co), idx(sec('frame'), st.frame)];
  ['risk','metric','change'].forEach(function(k){ st[k].forEach(function(id){ n.push(idx(sec(k), id)); }); });
  n.push(st.privacy.length); st.privacy.forEach(function(id){ n.push(idx(sec('privacy'), id)); });
  n.push(st.ask.length); st.ask.forEach(function(id){ n.push(idx(sec('ask'), id)); });
  return ReportKit.encode(CODE, n.concat(st.ans));
}
function replay(n){
  var p = 0; function nx(){ if(p>=n.length) throw 0; return n[p++]; }
  try{
    var ci = nx(); if(ci>=C.length) return false; begin(ci);
    function take(k, count){ var s = sec(k), out = []; for(var q=0;q<count;q++){ var j = nx(); if(j>=s.cards.length || out.indexOf(s.cards[j].id)>=0) throw 0; out.push(s.cards[j].id); } return out; }
    st.frame = take('frame',1)[0]; st.risk = take('risk',3); st.metric = take('metric',4); st.change = take('change',2);
    var pc = nx(); if(pc<1 || pc>2) return false; st.privacy = take('privacy', pc);
    var ac = nx(); if(ac>8) return false; st.ask = take('ask', ac); if(askTotal()>CAP) return false;
    scoreReport(); qs = pickQs(); qi = 0; phase = 'qa';
    if(n.length - p !== qs.length) return false;
    for(qi=0; qi<qs.length; qi++){ var j = nx(); if(j>=qs[qi].a.length) return false; applyAnswer(j); }
    end(true); return true;
  }catch(e){ return false; }
}

/* ---------- outcome ---------- */
function outcome(){
  var f = funding(), c = meters.conf, r = meters.cred, title, sub;
  if(c>=75 && r>=75){ title = 'They want you back next quarter'; sub = 'The committee left knowing your top risks, how you\'re measuring progress, what changed and what you need. That\'s what earns a seat at the table.'; }
  else if(c>=55 && r>=55){ title = 'A solid first report'; sub = 'Most of what you put in front of the board earned its place, and a few choices cost you. Look at which sections drew the hard questions.'; }
  else if(r>=45){ title = 'They\'ll want more next time'; sub = 'The board heard a lot of information and not enough judgment. Boards want a few risks in business terms, honest metrics with a trend, and a clear ask.'; }
  else { title = 'A long ten minutes'; sub = 'Vanity metrics, technical risks or a wish list made the committee doubt the rest of the report. The good news is that this is the cheapest place to learn it.'; }
  return {title:title, sub:sub, f:f};
}
function sectionEntries(){
  var out = [];
  SEC.forEach(function(s){
    if(s.id==='ask'){ var ag = askGrade(), f = funding();
      out.push({sec:s, head:s.n+'. '+s.title, grade:ag.g, picks:st.ask.map(function(id){ var c = card(id); return {c:c, text:T(c.t,co)+' ($'+c.cost+'K)'+(f.approved.indexOf(id)>=0?': approved':askLinked(id)?': deferred':': not tied to a risk'), why:c.why}; }), note:ag.l});
      return; }
    picksOf(s).forEach(function(id){ var c = card(id); out.push({sec:s, head:s.n+'. '+s.title, grade:grade(c), picks:[{c:c, text:T(c.t,co), why:c.why}]}); });
  });
  return out;
}
function end(rebuilt){
  phase = 'done';
  var o = outcome(), f = o.f, code = runCode();
  var pn = ReportKit.panel({code:code, rebuilt:rebuilt, getDoc:report});
  var h = '<div class="game"><section class="end"><span class="eyebrow">'+esc(co.name)+' · audit committee debrief</span><p class="rk-printname note" style="margin:4px 0 0"></p><h2>'+esc(o.title)+'</h2><p class="lede" style="max-width:62ch">'+esc(o.sub)+'</p>';
  if(bottom) h += '<div class="inject"><span class="eyebrow">Your bottom line</span>'+esc(bottom)+'</div>';
  h += '<div class="grid2"><div class="stat"><div class="n">'+meters.conf+'</div><div class="l">board confidence</div></div><div class="stat"><div class="n">'+meters.cred+'</div><div class="l">your credibility</div></div><div class="stat"><div class="n">'+money(f.total)+'</div><div class="l">approved, of '+money(askTotal())+' requested</div></div><div class="stat"><div class="n">'+sectionEntries().filter(function(e){ return e.grade==='best'; }).length+' / '+sectionEntries().length+'</div><div class="l">strong choices in the report</div></div></div>';
  h += '<div class="sec"><h3>Your report, section by section</h3><div class="debrief">';
  sectionEntries().forEach(function(e){
    h += '<div class="dl '+e.grade+'"><div class="h"><span>'+esc(e.head)+'</span><span>'+G[e.grade]+'</span></div>';
    if(!e.picks.length) h += '<p><b>You asked for nothing.</b></p>';
    e.picks.forEach(function(p){ h += '<p><b>'+esc(p.text)+'</b> <span class="tags">'+tagHTML(p.c)+'</span></p><p class="lesson" style="margin:4px 0 0;font-size:14px;color:var(--muted)">'+esc(p.why)+'</p>'; });
    if(e.note) h += '<p class="lesson" style="margin:6px 0 0;font-size:14px">'+esc(e.note)+'</p>';
    h += '</div>'; });
  h += '</div></div><div class="sec"><h3>The questions</h3><div class="debrief">';
  qs.forEach(function(q,k){ var a = q.a[st.ans[k]], d = co.dirs[q.who];
    h += '<div class="dl '+a.g+'"><div class="h"><span>'+esc(d[0])+'</span><span>'+(a.g==='best'?'Strong answer':a.g==='ok'?'Partly right':'Costly answer')+'</span></div><p>"'+esc(q.q(st, co))+'"</p><p><b>You said:</b> '+esc(a.t)+'</p><p class="lesson" style="margin:6px 0 0;font-size:14px;color:var(--muted)">'+esc(a.l)+'</p></div>'; });
  h += '</div></div><div class="real"><h3>What a board wants to hear</h3><ul><li>The top risks, in business terms.</li><li>A few honest metrics, with a trend over time.</li><li>What changed since the last meeting.</li><li>What you need from them, whether that\'s money, people or a decision.</li></ul><p class="note" style="margin-top:8px">The companies, directors and numbers are invented. The patterns behind them come from real incidents and real boardrooms.</p></div>';
  h += pn.html+'<div class="row"><button class="primary" id="again">Try another company</button><button class="linkbtn" id="same">Start over with this company</button></div></section>'+rail()+'</div>';
  app.innerHTML = h; pn.wire();
  var cur = C.indexOf(co);
  document.getElementById('again').onclick = function(){ var k; do{ k = Math.floor(Math.random()*C.length); }while(k===cur && C.length>1); start(k); };
  document.getElementById('same').onclick = function(){ start(cur); };
  window.scrollTo(0,0);
}
function report(name){
  var o = outcome(), f = o.f;
  var secs = [];
  secs.push({heading:'Your bottom line for the board', intro: bottom || '(None entered. The bottom line isn\'t part of the run code, so a rebuilt report never has one.)'});
  secs.push({heading:'Your report, section by section', entries: sectionEntries().map(function(e){
    return {head:e.head, tag:G[e.grade], grade:e.grade, chose: e.picks.length ? e.picks.map(function(p){ return p.text+' ['+tagText(p.c)+']'; }).join('; ') : 'Nothing requested.', lines: e.picks.map(function(p){ return p.why; }).concat(e.note?[e.note]:[])}; })});
  secs.push({heading:'The questions', entries: qs.map(function(q,k){ var a = q.a[st.ans[k]], d = co.dirs[q.who];
    return {head:d[0]+': "'+q.q(st, co)+'"', tag:(a.g==='best'?'Strong answer':a.g==='ok'?'Partly right':'Costly answer'), grade:a.g, chose:a.t, lines:[a.l]}; })});
  secs.push({heading:'What a board wants to hear', bullets:['The top risks, in business terms.','A few honest metrics, with a trend over time.','What changed since the last meeting.','What you need from them, whether that\'s money, people or a decision.'], note:'The companies, directors and numbers are invented.'});
  return {game:'The Board Report', kind:'Audit committee debrief', company:co.name, sector:co.sector, name:name, title:o.title, sub:o.sub, license:ReportKit.LICENSE,
    stats:[{label:'Board confidence', value:meters.conf, better:'high', note:'higher is better'},{label:'Your credibility', value:meters.cred, better:'high', note:'higher is better'},
           {label:'Funding approved, of '+money(askTotal())+' requested', value:money(f.total), bar:false}],
    sections:secs,
    verify:'To check this result, open The Board Report, choose "Check a result" on the start screen, and paste the run code. The game rebuilds the same report and answers, and the outcome should match this page. The bottom line is typed text, so it isn\'t part of the run code.'};
}

homeBtn.onclick = function(){
  var inGame = phase==='build' || phase==='qa';
  if(inGame && !armed){ armed = true; homeBtn.textContent = 'Leave this report?'; setTimeout(function(){ armed = false; homeBtn.textContent = 'New report'; }, 4000); return; }
  armed = false; homeBtn.textContent = 'New report'; SEC.forEach(function(s){ s.order = null; }); intro();
};
intro();
})();
</script>
